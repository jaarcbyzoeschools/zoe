name: Deploy Website to Bluehost

on:
  push:
    branches:
      - main  # This runs the script every time you push to the 'main' branch

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Get latest code from GitHub
      uses: actions/checkout@v4

    - name: 2. Set up Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Install project dependencies
      run: npm install

    - name: 4. Build the project
      run: npm run build  # This creates your 'dist' folder automatically

    - name: 5. Upload 'dist' folder to Bluehost
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/  # This targets your dist folder
        server-dir: ./  # Change this if your site sits in a subfolder on Bluehost